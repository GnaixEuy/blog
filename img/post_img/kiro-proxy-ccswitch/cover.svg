<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kiro Proxy with CC Switch and Claude Code</title>
  <desc id="desc">A clean cover image for a tutorial about Kiro Gateway reverse proxy, CC Switch, and Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="48%" stop-color="#12312b"/>
      <stop offset="100%" stop-color="#2f2a12"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e7f5f0" stop-opacity="0.94"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#ffffff" stroke-width="1">
    <path d="M120 95 H1080"/>
    <path d="M120 535 H1080"/>
    <path d="M180 60 V570"/>
    <path d="M1020 60 V570"/>
    <circle cx="1020" cy="95" r="5" fill="#ffffff"/>
    <circle cx="180" cy="535" r="5" fill="#ffffff"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="92" width="1016" height="446" rx="28" fill="url(#card)"/>
  </g>

  <text x="144" y="170" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f766e">技能指北</text>
  <text x="144" y="250" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">用 Kiro Gateway</text>
  <text x="144" y="325" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="58" font-weight="800" fill="#111827">搭建自己的 Kiro Proxy</text>
  <text x="148" y="384" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="25" fill="#475569">通过 CC Switch 接入 Claude Code，把 Kiro Pro 额度用于本地开发</text>

  <g transform="translate(145 432)" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif">
    <rect x="0" y="0" width="188" height="54" rx="16" fill="#0f766e"/>
    <text x="94" y="35" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Claude Code</text>
    <path d="M197 27 H255" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M247 17 L260 27 L247 37" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="270" y="0" width="160" height="54" rx="16" fill="#f59e0b"/>
    <text x="350" y="35" font-size="20" font-weight="700" text-anchor="middle" fill="#111827">CC Switch</text>
    <path d="M440 27 H498" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M490 17 L503 27 L490 37" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="513" y="0" width="170" height="54" rx="16" fill="#155e75"/>
    <text x="598" y="35" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">nginx</text>
    <path d="M693 27 H751" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M743 17 L756 27 L743 37" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="766" y="0" width="190" height="54" rx="16" fill="#111827"/>
    <text x="861" y="35" font-size="20" font-weight="700" text-anchor="middle" fill="#ffffff">Kiro Gateway</text>
  </g>

  <g transform="translate(842 155)">
    <rect x="0" y="0" width="194" height="176" rx="22" fill="#111827"/>
    <rect x="22" y="28" width="150" height="16" rx="8" fill="#34d399"/>
    <rect x="22" y="62" width="108" height="16" rx="8" fill="#fbbf24"/>
    <rect x="22" y="96" width="132" height="16" rx="8" fill="#67e8f9"/>
    <circle cx="154" cy="128" r="20" fill="#f8fafc"/>
    <path d="M145 128 L153 136 L166 118" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
